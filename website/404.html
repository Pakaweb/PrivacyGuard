<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — PrivacyGuard</title>
  <meta name="description" content="This page is not on the PrivacyGuard website." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0d12" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("privacyguard.siteTheme");
        if (theme !== "light" && theme !== "dark") {
          theme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="wrap" style="padding: 80px 0 120px; max-width: 40rem;">
    <p class="kicker">404</p>
    <h1>This page isn’t here</h1>
    <p class="lede">The link may be old, or the page moved. PrivacyGuard’s public pages are Home, Download, and Privacy policy.</p>
    <div class="cta-row">
      <a class="btn accent lg" href="index.html">Back to home</a>
      <a class="btn ghost" href="download.html">Download</a>
    </div>
  </main>
</body>
</html>
