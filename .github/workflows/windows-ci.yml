name: windows-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild PrivacyGuard.sln -restore -p:Configuration=Release -p:Platform=x64

      - name: Test
        run: dotnet test tests/PrivacyGuard.Tests/PrivacyGuard.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore
